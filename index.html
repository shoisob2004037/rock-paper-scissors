<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
            transition: all 0.3s ease;
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 2rem;
            font-weight: 600;
        }

        .auth-section {
            text-align: center;
        }

        .auth-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .auth-buttons button {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: #3498db;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .auth-buttons button:hover {
            background: #2980b9;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .form-container {
            margin: 2rem 0;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container input {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: none;
            border-radius: 10px;
            background: #f1f3f5;
            font-size: 1rem;
            color: #2c3e50;
            transition: all 0.3s ease;
        }

        .form-container input:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
            background: #fff;
        }

        .form-container button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 25px;
            background: #2ecc71;
            color: white;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-container button:hover {
            background: #27ae60;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .social-buttons button {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            border: none;
            border-radius: 25px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            background: #e74c3c;
            transition: all 0.3s ease;
        }

        .social-buttons button:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .user-info {
            text-align: center;
            margin: 1.5rem 0;
        }

        .user-info p {
            font-size: 1.2rem;
            color: #2c3e50;
            font-weight: 500;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideIn 0.5s ease-in-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .game-container {
            margin-top: 2rem;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 2rem 0;
        }

        .buttons-container button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            background: #ecf0f1;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .buttons-container button:hover {
            background: #3498db;
            color: white;
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .score-board {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 15px;
            text-align: center;
            margin-top: 2rem;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .result-display h3 {
            font-size: 1.2rem;
            margin: 0.5rem 0;
            color: #7f8c8d;
        }

        #resetButton, #logoutButton {
            margin-top: 1rem;
            padding: 10px 25px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #resetButton:hover, #logoutButton:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="auth-section" id="btns">
            <h2>Welcome to RPS</h2>
            <div class="auth-buttons">
                <button id="signup-btn">Sign Up</button>
                <button id="login-btn">Log In</button>
            </div>
        </div>

        <div id="signup-form" class="form-container" style="display: none;">
            <h2>Create Account</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <button id="submitData">Register</button>
            <div class="social-buttons">
                <button id="google">Google Sign In</button>
            </div>
            <p style="text-align: center; margin-top: 1rem;">
                <a href="#" id="back-to-login" style="color: #3498db; text-decoration: none;">Back to Login</a>
            </p>
        </div>

        <div id="login-form" class="form-container" style="display: none;">
            <h2>Login</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button id="submitData2">Login</button>
            <p style="text-align: center; margin-top: 1rem;">
                <a href="#" id="back-to-signup" style="color: #3498db; text-decoration: none;">Need an account? Sign Up</a>
            </p>
        </div>

        <div id="user-info" class="user-info" style="display: none;">
            <p id="usernameDisplay">Hi, user@example.com</p>
            <button id="logoutButton">Logout</button>
        </div>

        <div class="game-container">
            <h2>Rock Paper Scissors</h2>
            <div class="buttons-container">
                <button id="rockButton"><i class="fas fa-hand-rock"></i> Rock</button>
                <button id="paperButton"><i class="fas fa-hand-paper"></i> Paper</button>
                <button id="scissorsButton"><i class="fas fa-hand-scissors"></i> Scissors</button>
            </div>

            <div class="result-display">
                <h3 id="playerShow">Player: <span></span></h3>
                <h3 id="computerShow">Computer: <span></span></h3>
                <h3 id="result"></h3>
            </div>

            <div class="score-board" id="score">
                <h3>Score (Cycle of 50)</h3>
                Current: <span id="currentScore">0/0</span><br>
                Wins: <span id="winScore">0</span><br>
                Losses: <span id="loseScore">0</span><br>
                Ties: <span id="tieScore">0</span>
                <button id="resetButton">Reset</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA_trISOdHuMb5nvbq_3aCs6aomBrw50vQ",
            authDomain: "game-88c46.firebaseapp.com",
            projectId: "game-88c46",
            storageBucket: "game-88c46.appspot.com",
            messagingSenderId: "832785430245",
            appId: "1:832785430245:web:982cebefb02166d1ff860c"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // UI Toggles
        document.getElementById('signup-btn').addEventListener('click', () => {
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
            document.getElementById('btns').style.display = 'none';
        });

        document.getElementById('login-btn').addEventListener('click', () => {
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('btns').style.display = 'none';
        });

        document.getElementById('back-to-login').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'block';
        });

        document.getElementById('back-to-signup').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('signup-form').style.display = 'block';
        });

        // Signup
        document.getElementById('submitData').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const username = document.getElementById('username').value;

            if (!email || !password || !username) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                await setDoc(doc(db, "users", user.uid), {
                    username: username,
                    email: email,
                    scores: {
                        currentCycleGames: 0,
                        currentCycleWins: 0,
                        totalWins: 0,
                        totalLosses: 0,
                        totalTies: 0
                    }
                });
                alert('User Created Successfully.');
                showUserInfo(user);
                loadScores(user.uid);
            } catch (error) {
                alert('Signup Error: ' + error.message);
            }
        });

        // Login
        document.getElementById('submitData2').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                showUserInfo(user);
                await loadScores(user.uid);
                alert('Logged in Successfully.');
            } catch (error) {
                alert('Login Error: ' + error.message);
            }
        });

        // Google Sign In
        document.getElementById('google').addEventListener('click', async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const userDocRef = doc(db, "users", user.uid);
                const userDoc = await getDoc(userDocRef);

                if (!userDoc.exists()) {
                    await setDoc(userDocRef, {
                        username: user.displayName,
                        email: user.email,
                        scores: {
                            currentCycleGames: 0,
                            currentCycleWins: 0,
                            totalWins: 0,
                            totalLosses: 0,
                            totalTies: 0
                        }
                    });
                }

                showUserInfo(user);
                await loadScores(user.uid);
                alert('Logged in with Google Successfully.');
            } catch (error) {
                alert('Google Sign-in Error: ' + error.message);
            }
        });

        // Logout
        document.getElementById('logoutButton').addEventListener('click', async () => {
            try {
                await signOut(auth);
                document.getElementById('user-info').style.display = 'none';
                document.getElementById('btns').style.display = 'block';
                resetUI();
                alert('Logged out Successfully.');
            } catch (error) {
                alert('Logout Error: ' + error.message);
            }
        });

        // Game Logic
        const choices = ['rock', 'paper', 'scissors'];
        document.getElementById('rockButton').addEventListener('click', () => playGame('rock'));
        document.getElementById('paperButton').addEventListener('click', () => playGame('paper'));
        document.getElementById('scissorsButton').addEventListener('click', () => playGame('scissors'));

        async function playGame(playerChoice) {
            const user = auth.currentUser;
            if (!user) {
                alert('Please log in to play!');
                return;
            }

            const computerChoice = choices[Math.floor(Math.random() * 3)];
            displayChoices(playerChoice, computerChoice);
            
            const result = determineWinner(playerChoice, computerChoice);
            document.getElementById('result').textContent = result.message;
            
            await updateCycleScore(user.uid, result.won);
        }

        function displayChoices(player, computer) {
            document.getElementById('playerShow').querySelector('span').textContent = player;
            document.getElementById('computerShow').querySelector('span').textContent = computer;
        }

        function determineWinner(player, computer) {
            if (player === computer) return { message: "It's a Tie!", won: false, tie: true };
            if (
                (player === 'rock' && computer === 'scissors') ||
                (player === 'paper' && computer === 'rock') ||
                (player === 'scissors' && computer === 'paper')
            ) return { message: 'You Win!', won: true };
            return { message: 'You Lose!', won: false };
        }

        async function updateCycleScore(uid, won) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userDoc = await getDoc(userDocRef);
                if (!userDoc.exists()) {
                    throw new Error("User document not found");
                }

                const scores = userDoc.data().scores || {
                    currentCycleGames: 0,
                    currentCycleWins: 0,
                    totalWins: 0,
                    totalLosses: 0,
                    totalTies: 0
                };

                scores.currentCycleGames = (scores.currentCycleGames || 0) + 1;
                if (won) scores.currentCycleWins = (scores.currentCycleWins || 0) + 1;

                if (scores.currentCycleGames >= 50) {
                    const cycleWon = scores.currentCycleWins >= 25;
                    scores.totalWins = (scores.totalWins || 0) + (cycleWon ? 1 : 0);
                    scores.totalLosses = (scores.totalLosses || 0) + (cycleWon ? 0 : 1);
                    scores.totalTies = (scores.totalTies || 0) + (scores.currentCycleWins === 25 ? 1 : 0);
                    scores.currentCycleGames = 0;
                    scores.currentCycleWins = 0;
                }

                await updateDoc(userDocRef, { scores: scores });
                updateUIScores(scores);
            } catch (error) {
                console.error('Error updating score:', error);
                alert('Error updating score: ' + error.message);
            }
        }

        async function loadScores(uid) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userDoc = await getDoc(userDocRef);
                if (userDoc.exists()) {
                    const scores = userDoc.data().scores || {
                        currentCycleGames: 0,
                        currentCycleWins: 0,
                        totalWins: 0,
                        totalLosses: 0,
                        totalTies: 0
                    };
                    updateUIScores(scores);
                } else {
                    console.log("No scores found, initializing...");
                    const initialScores = {
                        currentCycleGames: 0,
                        currentCycleWins: 0,
                        totalWins: 0,
                        totalLosses: 0,
                        totalTies: 0
                    };
                    await setDoc(userDocRef, { scores: initialScores }, { merge: true });
                    updateUIScores(initialScores);
                }
            } catch (error) {
                console.error('Error loading scores:', error);
                alert('Error loading scores: ' + error.message);
            }
        }

        function updateUIScores(scores) {
            document.getElementById('currentScore').textContent = `${scores.currentCycleWins}/${scores.currentCycleGames}`;
            document.getElementById('winScore').textContent = scores.totalWins || 0;
            document.getElementById('loseScore').textContent = scores.totalLosses || 0;
            document.getElementById('tieScore').textContent = scores.totalTies || 0;
        }

        document.getElementById('resetButton').addEventListener('click', async () => {
            const user = auth.currentUser;
            if (user) {
                try {
                    const userDocRef = doc(db, "users", user.uid);
                    const resetScores = {
                        currentCycleGames: 0,
                        currentCycleWins: 0,
                        totalWins: 0,
                        totalLosses: 0,
                        totalTies: 0
                    };
                    await updateDoc(userDocRef, { scores: resetScores });
                    updateUIScores(resetScores);
                    alert('Scores reset successfully.');
                } catch (error) {
                    alert('Error resetting scores: ' + error.message);
                }
            }
        });

        function showUserInfo(user) {
            document.getElementById('user-info').style.display = 'block';
            document.getElementById('usernameDisplay').textContent = `Hi, ${user.email}`;
            document.getElementById('signup-form').style.display = 'none';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('btns').style.display = 'none';
        }

        function resetUI() {
            document.getElementById('currentScore').textContent = '0/0';
            document.getElementById('winScore').textContent = '0';
            document.getElementById('loseScore').textContent = '0';
            document.getElementById('tieScore').textContent = '0';
            document.getElementById('playerShow').querySelector('span').textContent = '';
            document.getElementById('computerShow').querySelector('span').textContent = '';
            document.getElementById('result').textContent = '';
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                showUserInfo(user);
                loadScores(user.uid);
            } else {
                resetUI();
                document.getElementById('user-info').style.display = 'none';
                document.getElementById('btns').style.display = 'block';
            }
        });
    </script>
</body>
</html>
